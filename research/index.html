<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Research — Lighthouse Macro</title>
<link rel="canonical" href="https://lighthousemacro.com/desk/">
<meta http-equiv="refresh" content="0; url=/desk/">
<meta name="robots" content="noindex">
<script>window.location.replace("/desk/");</script>
<style>
  :root{ --ocean:#2389BB; --dusk:#FF6723; --deep:#123456; --glacier:#F4F7F9; }
  html,body{margin:0;height:100%;}
  body{font-family:"Inter","Helvetica Neue",Arial,sans-serif;background:var(--glacier);
       color:var(--deep);display:flex;align-items:center;justify-content:center;text-align:center;}
  .bar{position:fixed;top:0;left:0;right:0;height:5px;
       background:linear-gradient(90deg,var(--ocean) 0 66%,var(--dusk) 66% 100%);}
  h1{font-family:"Montserrat","Inter",sans-serif;font-size:22px;margin:0 0 10px;}
  p{margin:0 0 18px;color:#5B7189;font-size:15px;}
  a{display:inline-block;background:var(--ocean);color:#fff;text-decoration:none;
    font-weight:600;padding:11px 22px;border-radius:3px;}
</style>
</head>
<body>
<div class="bar"></div>
<div>
  <h1>Research lives on the desk</h1>
  <p>The Reading Room is retired. A note is written, scored, and opened on Pharos Desk.</p>
  <a href="/desk/">Open the desk</a>
</div>
</body>
</html>
