# The Reading Room rebuilds itself from Substack every hour.
#
# It owns research/, feed.xml and sitemap.xml, and keeps the hand-built pages
# (start-here, framework, methodology) linked to it. The Mac's 07:45 job owns
# index.html and patches its own links (tools/reading_room/site_links.py --homepage).
#
# Safety interlock: nothing is committed until tools/reading_room/mac-handoff.txt
# exists. The Mac's new daily job writes that file the first time it runs, which is
# also the moment the Mac stops writing research/. Before then a scheduled run does
# nothing, and a manual or push-triggered run builds everything as a dry run.
name: Reading Room

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/reading_room/**"
      - ".github/workflows/reading-room.yml"

permissions:
  contents: write

concurrency:
  group: reading-room
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check the Mac handoff
        id: handoff
        run: |
          if [ -f tools/reading_room/mac-handoff.txt ]; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "The Mac handoff marker is not in place yet: this run commits nothing." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-python@v5
        if: steps.handoff.outputs.live == 'true' || github.event_name != 'schedule'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/reading_room/requirements.txt

      - name: Install
        if: steps.handoff.outputs.live == 'true' || github.event_name != 'schedule'
        run: pip install -r tools/reading_room/requirements.txt

      - uses: actions/cache@v4
        if: steps.handoff.outputs.live == 'true' || github.event_name != 'schedule'
        with:
          path: .rr-cache
          key: rr-cache-${{ github.run_id }}
          restore-keys: rr-cache-

      - name: Build the Reading Room
        id: build
        if: steps.handoff.outputs.live == 'true' || github.event_name != 'schedule'
        run: |
          set +e
          python tools/reading_room/build.py --root . --cache .rr-cache > build.log 2>&1
          code=$?
          set -e
          cat build.log
          { echo '```'; cat build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ge 2 ] && [ "$code" -le 4 ]; then
            # Substack hiccup or a partial pull: leave the live site alone and try again next hour.
            echo "::warning::Skipped this hour: $(tail -n 1 build.log)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$code" -eq 0 ] || exit "$code"
          python tools/reading_room/site_links.py --root . --static | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish
        if: steps.handoff.outputs.live == 'true' && steps.build.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- research feed.xml sitemap.xml start-here.html framework.html methodology.html
          if git diff --cached --quiet; then
            echo "Nothing new. The Reading Room is current." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -q -m "Reading Room refresh $(TZ=America/New_York date '+%Y-%m-%d %H:%M') ET"
          for i in 1 2 3 4; do
            if git push -q origin HEAD:main; then
              echo "Published." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((i * 5))
            git fetch -q --depth=50 origin main
            git rebase -q origin/main || { git rebase --abort; echo "::warning::Rebase conflict; the next hourly run will retry."; exit 0; }
          done
          echo "::warning::Push failed after retries; the next hourly run will retry."
